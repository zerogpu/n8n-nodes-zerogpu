name: Publish to npm

# Publishes @zerogpu/n8n-nodes-zerogpu to the public npm registry from `main`
# using npm OIDC "trusted publishing" — there is NO long-lived NPM_TOKEN.
# Same release mechanics as @zerogpu/ai-sdk-provider.
#
# WHY THIS SHAPE (n8n policy)
#   Since May 1 2026 n8n only verifies community nodes that a GitHub Actions
#   workflow published with an npm provenance attestation; a version published
#   from a laptop can never become a verified community node. Trusted
#   publishing generates the attestation automatically (the repo and the
#   package are both public), and NPM_CONFIG_PROVENANCE=true makes the publish
#   fail loudly instead of silently shipping a version without one.
#   https://docs.n8n.io/integrations/creating-nodes/deploy/submit-community-nodes/
#
# RELEASE POLICY
#   Every push to `main` runs lint + build and then publishes package.json's
#   version IF that exact version is not on npm yet. Pushes that do not bump
#   the version are no-ops (the publish step is skipped), so releasing = bump
#   `version` in package.json and merge to main. `npm run release` (release-it:
#   lint, build, bump, changelog, commit, tag, push main, GitHub release) still
#   works and lands here through the push to main. npm rejects re-publishing an
#   existing version, so a re-run can never overwrite a shipped release.
#
#   dist-tag: plain X.Y.Z -> `latest`; a prerelease (X.Y.Z-beta.1, ...) -> `next`
#   (prereleases are invisible to caret ranges and to a bare `npm install`).
#
#   package.json's prepublishOnly hook (`n8n-node prerelease`) refuses every
#   `npm publish` unless RELEASE_MODE=true; that is how the n8n CLI blocks
#   accidental laptop publishes. The publish step below sets it.
#
# ONE-TIME SETUP
#   npm only lets a trusted publisher be attached to a package that already
#   exists, so the package was created with a throwaway bootstrap publish
#   (0.1.0-bootstrap.0, dist-tag `bootstrap`, no provenance) rather than a
#   provenance-less 0.1.0. Then this workflow is attached as the package's
#   trusted publisher, from an npmjs session with 2FA (a "bypass 2FA" token is
#   refused with E403 for this since July 2026):
#     npmjs.com -> package settings -> Trusted Publisher -> GitHub Actions
#       owner zerogpu, repository n8n-nodes-zerogpu,
#       workflow publish.yml, environment prod
#   or with the CLI (npm >= 11.15):
#     npx -y npm@11 trust github @zerogpu/n8n-nodes-zerogpu \
#       --file publish.yml --repository zerogpu/n8n-nodes-zerogpu --environment prod
#   npm allows ONE trusted publisher per package, pinned to this exact workflow
#   filename and the `prod` GitHub environment, so keep both names stable.
#
# Requirements (satisfied below): Node >= 22, npm >= 11.5.1, `id-token: write`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    # A manual run from any other branch must never publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write # gh release create
      id-token: write # lets the job mint the OIDC token npm exchanges for publish auth and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Pinned to the v11 line: npm 12.0.0 ships a broken libnpmpublish that
      # crashes with "Cannot find module 'sigstore'" on any publish (npm/cli#9722).
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: npm ci

      # The same two checks `n8n-node release` runs in CI before it publishes.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Idempotency gate: a push to main that does not bump the version is a
      # no-op. `npm view <name>@<version> version` prints the version when it
      # exists and nothing (or a 404) when it does not.
      - name: Resolve version, dist-tag and whether to publish
        id: pkg
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then TAG="next"; else TAG="latest"; fi
          FOUND="$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)"
          if [[ "$FOUND" == "$VERSION" ]]; then
            echo "::notice::${NAME}@${VERSION} is already on npm; nothing to publish."
            PUBLISH="false"
          else
            echo "Will publish ${NAME}@${VERSION} under dist-tag ${TAG}"
            PUBLISH="true"
          fi
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN: auth is the OIDC trusted publisher configured on
      # npmjs for this repo + workflow file + environment.
      - name: Publish (OIDC, no token, with provenance)
        if: steps.pkg.outputs.publish == 'true'
        env:
          RELEASE_MODE: 'true' # satisfies the n8n CLI prepublishOnly guard
          NPM_CONFIG_PROVENANCE: 'true' # n8n verification needs the attestation; fail rather than publish without it
        run: npm publish --tag "${{ steps.pkg.outputs.tag }}"

      # The registry read path can lag a publish by a couple of minutes.
      - name: Verify the version is visible on npm
        if: steps.pkg.outputs.publish == 'true'
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          for i in $(seq 1 12); do
            FOUND="$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)"
            if [[ "$FOUND" == "$VERSION" ]]; then
              echo "${NAME}@${VERSION} is on npm; dist-tags: $(npm view "$NAME" dist-tags --json)"
              exit 0
            fi
            echo "not visible yet (attempt ${i}/12), waiting 15 s..."
            sleep 15
          done
          echo "::error::${NAME}@${VERSION} not visible on npm 3 minutes after publish"
          exit 1

      # `npm run release` (release-it) may already have created this release;
      # then this is a no-op.
      - name: Create GitHub release
        if: steps.pkg.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          REL="v${VERSION}"
          if gh release view "$REL" >/dev/null 2>&1 || gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release for ${VERSION} already exists; skipping"
            exit 0
          fi
          EXTRA=()
          [[ "$TAG" == "next" ]] && EXTRA+=(--prerelease)
          gh release create "$REL" --target "$GITHUB_SHA" --title "$REL" --generate-notes "${EXTRA[@]}"

      - name: Summary
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          TAG: ${{ steps.pkg.outputs.tag }}
          PUBLISHED: ${{ steps.pkg.outputs.publish }}
        run: |
          {
            if [[ "$PUBLISHED" == "true" ]]; then
              echo "### Published ${NAME}@${VERSION} (OIDC, provenance)"
              echo ""
              echo "dist-tag: \`${TAG}\`"
              echo ""
              echo '```bash'
              echo "npm install ${NAME}@${VERSION}"
              echo '```'
            else
              echo "### Nothing published"
              echo ""
              echo "${NAME}@${VERSION} is already on npm. Bump \`version\` in package.json to release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
